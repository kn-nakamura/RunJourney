name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (iOS)
    runs-on: macos-latest
    timeout-minutes: 30

    env:
      SCHEME: RunJourney
      PROJECT: RunJourney.xcodeproj

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Use the most recently installed Xcode without relying on a
          # third-party action that may not recognise newer Xcode versions.
          XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "No Xcode found in /Applications" >&2
            ls /Applications/ >&2
            exit 1
          fi
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          sw_vers
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true

      - name: Bootstrap Xcode environment
        run: sudo xcodebuild -runFirstLaunch || true

      - name: Build
        run: |
          set -o pipefail
          # Use a generic iOS Simulator destination so the build succeeds
          # without needing a specific simulator runtime installed.
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Resolve simulator for tests
        id: sim
        run: |
          # After bootstrapping, check whether a concrete iPhone simulator
          # (with an installed runtime) is available.  If not, tests are
          # skipped and only the compilation result above is reported.
          sim_line=$(xcrun simctl list devices available \
            | awk '/^-- iOS/{match($0, /iOS ([0-9.]+)/, a); ios=a[1]} /iPhone.*\(/{if(ios) print ios"|"$0}' \
            | tail -n 1)
          if [ -z "$sim_line" ]; then
            echo "No iPhone simulator runtime found; skipping test run." >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            ios_version=$(echo "$sim_line" | cut -d'|' -f1)
            sim_name=$(echo "$sim_line" | cut -d'|' -f2 \
              | sed -E 's/^ *//; s/ \(.*$//')
            echo "Selected: $sim_name (iOS $ios_version)"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "destination=platform=iOS Simulator,name=$sim_name,OS=$ios_version" \
              >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        if: steps.sim.outputs.skip != 'true'
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "${{ steps.sim.outputs.destination }}" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            test
