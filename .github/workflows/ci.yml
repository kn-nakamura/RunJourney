name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (iOS Simulator)
    runs-on: macos-latest
    timeout-minutes: 30

    env:
      SCHEME: RunJourney
      PROJECT: RunJourney.xcodeproj
      DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=latest

    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true

      - name: Resolve a bootable iPhone simulator
        id: sim
        run: |
          # Pick the newest available iPhone simulator so we don't pin a name that the runner doesn't ship.
          name=$(xcrun simctl list devices available \
            | awk -F '[()]' '/^-- iOS/{rt=$0} /iPhone.*\(/{print rt" | "$0}' \
            | grep -E "iPhone " \
            | tail -n 1 \
            | sed -E 's/.*\| *([^(]+) \(.*/\1/' \
            | sed 's/[[:space:]]*$//')
          if [ -z "$name" ]; then
            echo "No iPhone simulator available on the runner." >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "Selected simulator: $name"
          echo "destination=platform=iOS Simulator,name=$name,OS=latest" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "${{ steps.sim.outputs.destination }}" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Test
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "${{ steps.sim.outputs.destination }}" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            test
