name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (iOS Simulator)
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      SCHEME: RunJourney
      PROJECT: RunJourney.xcodeproj

    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true

      - name: Install iOS Simulator runtime
        run: |
          # Xcode 16+ ships Simulator runtimes separately from the IDE.
          # Download the platform support so concrete simulator devices are
          # available for building and running tests.
          xcodebuild -downloadPlatform iOS

      - name: Resolve a bootable iPhone simulator
        id: sim
        run: |
          # Find the newest available iPhone simulator and its exact iOS version.
          # Using the precise version avoids xcodebuild rejecting "OS=latest" when
          # the resolved version is older than the project's deployment target.
          sim_line=$(xcrun simctl list devices available \
            | awk '/^-- iOS/{match($0, /iOS ([0-9.]+)/, a); ios=a[1]} /iPhone.*\(/{if(ios) print ios"|"$0}' \
            | tail -n 1)
          if [ -z "$sim_line" ]; then
            echo "No iPhone simulator available on the runner." >&2
            xcrun simctl list devices available
            exit 1
          fi
          ios_version=$(echo "$sim_line" | cut -d'|' -f1)
          sim_name=$(echo "$sim_line" | cut -d'|' -f2 | sed -E 's/^ *//; s/ \(.*$//')
          echo "Selected simulator: $sim_name (iOS $ios_version)"
          echo "destination=platform=iOS Simulator,name=$sim_name,OS=$ios_version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "${{ steps.sim.outputs.destination }}" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Test
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "${{ steps.sim.outputs.destination }}" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            test
